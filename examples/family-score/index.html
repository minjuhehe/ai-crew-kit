<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>แต้มบ้านเรา</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#1d2a26; --muted:#5d6b66; --accent:#1f6f5c; --minus:#b5523b; --line:#ddd6c8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 18px/1.4 system-ui, "Noto Sans Thai", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 28px; margin: 8px 0 16px; }
  form { display:flex; gap:8px; margin-bottom: 8px; }
  input { flex:1; min-width:0; font-size:20px; padding: 0 14px; height:56px; border:2px solid var(--line); border-radius:14px; background:#fff; }
  input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; border:0; border-radius:14px; cursor:pointer; }
  .add { height:56px; padding:0 18px; background:var(--accent); color:#fff; font-weight:700; white-space:nowrap; }
  .add:disabled { opacity:.45; }
  .msg { min-height: 24px; color: var(--muted); font-size:16px; margin: 0 0 12px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; display:grid; grid-template-columns: 72px 1fr 72px; align-items:center; gap:10px; }
  .name { font-size:20px; font-weight:700; text-align:center; overflow-wrap:anywhere; }
  .score { font-size:44px; font-weight:800; text-align:center; line-height:1.1; font-variant-numeric: tabular-nums; }
  .unit { display:block; font-size:14px; color:var(--muted); font-weight:400; }
  .step { height:72px; font-size:32px; font-weight:800; color:#fff; }
  .plus { background: var(--accent); }
  .minus { background: var(--minus); }
  .hint { margin-top:20px; font-size:15px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <form id="addForm" autocomplete="off">
    <input id="nameInput" type="text" enterkeyhint="done">
    <button id="addBtn" class="add" type="submit"></button>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <ul id="players"></ul>
  <p id="hint" class="hint"></p>
</main>
<script src="config.js"></script>
<script src="lang/th.js"></script>
<script>
(function () {
  const C = window.APP_CONFIG, T = window.TEXT;
  const fmt = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
  const $ = (id) => document.getElementById(id);
  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(C.storageKey);
      const data = raw ? JSON.parse(raw) : null;
      if (data && Array.isArray(data.players)) {
        return data.players
          .filter(p => p && typeof p.name === "string" && Number.isFinite(p.score))
          .slice(0, C.maxPlayers);
      }
    } catch (e) { storageOk = false; }
    return [];
  }
  function save() {
    try { localStorage.setItem(C.storageKey, JSON.stringify({ players })); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  let players = load();

  function render(message) {
    $("title").textContent = T.title;
    document.title = T.title;
    $("nameInput").placeholder = T.namePlaceholder;
    $("nameInput").maxLength = C.maxNameLength;
    $("addBtn").textContent = T.addPlayer;
    const full = players.length >= C.maxPlayers;
    $("addBtn").disabled = full;
    $("nameInput").disabled = full;
    const need = C.minPlayers - players.length;
    $("msg").textContent = message ||
      (full ? fmt(T.maxReached, { max: C.maxPlayers }) : need > 0 ? fmt(T.needMorePlayers, { n: need }) : "");
    $("hint").textContent = storageOk ? T.savedHint : T.storageBroken;

    const list = $("players");
    list.textContent = "";
    players.forEach((p, i) => {
      const li = document.createElement("li");
      const minus = C.scoreSteps.filter(s => s < 0)[0], plus = C.scoreSteps.filter(s => s > 0)[0];
      li.append(
        stepBtn(minus, i, "minus", fmt(T.minusLabel, { n: -minus, name: p.name })),
        Object.assign(document.createElement("div"), {}),
        stepBtn(plus, i, "plus", fmt(T.plusLabel, { n: plus, name: p.name }))
      );
      const mid = li.children[1];
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.name;
      const sc = document.createElement("div"); sc.className = "score"; sc.dataset.testid = "score";
      sc.textContent = p.score;
      const unit = document.createElement("span"); unit.className = "unit"; unit.textContent = T.points;
      sc.append(unit);
      mid.append(nm, sc);
      list.append(li);
    });
  }
  function stepBtn(step, i, cls, label) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "step " + cls;
    b.textContent = step > 0 ? "+" + step : "−" + (-step);
    b.setAttribute("aria-label", label);
    b.addEventListener("click", () => { players[i].score += step; save(); render(); });
    return b;
  }

  $("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("nameInput").value.trim().slice(0, C.maxNameLength);
    if (!name) return render(T.emptyName);
    if (players.some(p => p.name === name)) return render(T.duplicateName);
    if (players.length >= C.maxPlayers) return render();
    players.push({ name, score: 0 });
    save();
    $("nameInput").value = "";
    render();
  });

  render();
})();
</script>
</body>
</html>
